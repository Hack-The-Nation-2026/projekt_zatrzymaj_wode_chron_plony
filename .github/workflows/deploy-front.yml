name: Deploy front to Vercel

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-front.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Aplikacja jest w web/, a projekt na Vercelu nie jest podpięty do
      # repozytorium (prywatna organizacja na planie Hobby), więc deploy
      # uruchamiamy z tego katalogu i wskazujemy projekt przez VERCEL_ORG_ID
      # oraz VERCEL_PROJECT_ID.
      - name: Deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 build --prod --yes --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
